[package]
name = "deepwoken-build-optimizer"
version = "0.1.0"
edition = "2024"
description = "deepwoken build optimizer"

[dependencies]
eframe = "0.33"
egui = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
